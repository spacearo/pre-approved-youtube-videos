<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="referrer"
          content="strict-origin-when-cross-origin">

    <meta name="theme-color" content="#0b1020">

    <title>My Approved Playlist</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            background: #0b1020;
            color: white;
        }

        header {
            padding: 25px 20px;
            background: #172340;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .subtitle {
            color: #aab9d5;
            margin-top: 8px;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 20px;
        }

        .panel {
            background: #172238;
            border: 1px solid #344362;
            border-radius: 16px;
            padding: 15px;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            border-radius: 12px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        button {
            padding: 12px 15px;
            background: #30456c;
            color: white;
            border: 1px solid #52658a;
            border-radius: 9px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #4968e9;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid #91afff;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .playlist {
            max-height: 550px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .playlist button {
            padding: 15px 5px;
        }

        .playlist button.active {
            background: #4968e9;
            border-color: #a8baff;
        }

        input {
            padding: 12px;
            background: #0b1428;
            color: white;
            border: 1px solid #52658a;
            border-radius: 9px;
            font-size: 16px;
            width: 120px;
        }

        .status {
            color: #b5c3de;
            font-size: 14px;
            line-height: 1.5;
        }

        .jump {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        @media (max-width: 750px) {
            .container {
                grid-template-columns: 1fr;
            }

            main {
                padding: 12px;
            }

            .playlist {
                max-height: 420px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>▶ My Approved Playlist</h1>
    <div class="subtitle">
        Only the videos you selected
    </div>
</header>

<main>

    <div class="container">

        <!-- VIDEO PLAYER -->

        <section class="panel">

            <div class="video-container">

                <iframe
                    id="videoPlayer"
                    title="Approved YouTube playlist"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay;
                           clipboard-write; encrypted-media;
                           gyroscope; picture-in-picture;
                           web-share"
                    allowfullscreen>
                </iframe>

            </div>

            <div class="controls">

                <button onclick="previousVideo()">
                    ← Previous
                </button>

                <button onclick="nextVideo()">
                    Next →
                </button>

                <button onclick="refreshVideo()">
                    ↻ Refresh
                </button>

            </div>

            <p class="status" id="currentVideo">
                Video 1
            </p>

            <p class="status">
                This player uses YouTube's
                privacy-enhanced embedding domain.
            </p>

        </section>


        <!-- PLAYLIST -->

        <section class="panel">

            <h2>Choose a video</h2>

            <div class="jump">

                <label for="videoNumber">
                    Jump to #
                </label>

                <input
                    type="number"
                    id="videoNumber"
                    min="1"
                    max="200"
                    placeholder="125">

                <button onclick="jumpToNumber()">
                    Go
                </button>

            </div>

            <div
                id="playlist"
                class="playlist">
            </div>

            <p class="status">
                Select a video number to jump
                directly to that position.
            </p>

            <p class="status" id="message"></p>

        </section>

    </div>

</main>


<script>

    /*
    =====================================
    PLAYLIST SETTINGS
    =====================================
    */

    const PLAYLIST_ID = "PLdJXwy8HTZzE";

    // Change this if your playlist has
    // a different number of videos.

    const TOTAL_VIDEOS = 200;

    // Use YouTube's privacy-enhanced domain.

    const EMBED_DOMAIN =
        "https://www.youtube-nocookie.com";

    let currentIndex = 0;


    /*
    =====================================
    BUILD VIDEO URL
    =====================================
    */

    function getVideoURL(index) {

        const params = new URLSearchParams({
            list: PLAYLIST_ID,
            index: String(index),
            playsinline: "1",
            rel: "0"
        });

        return (
            EMBED_DOMAIN +
            "/embed/videoseries?" +
            params.toString()
        );

    }


    /*
    =====================================
    LOAD VIDEO
    =====================================
    */

    function loadVideo(index) {

        if (index < 0 || index >= TOTAL_VIDEOS) {
            return;
        }

        currentIndex = index;

        const player =
            document.getElementById("videoPlayer");

        player.src = getVideoURL(currentIndex);

        document.getElementById(
            "currentVideo"
        ).textContent =
            "Selected video " +
            (currentIndex + 1) +
            " of " +
            TOTAL_VIDEOS;


        updateActiveVideo();

    }


    /*
    =====================================
    NEXT AND PREVIOUS
    =====================================
    */

    function nextVideo() {

        if (currentIndex < TOTAL_VIDEOS - 1) {
            loadVideo(currentIndex + 1);
        }

    }


    function previousVideo() {

        if (currentIndex > 0) {
            loadVideo(currentIndex - 1);
        }

    }


    /*
    =====================================
    JUMP TO VIDEO
    =====================================
    */

    function jumpToNumber() {

        const input =
            document.getElementById("videoNumber");

        const number = Number(input.value);

        if (
            !Number.isInteger(number) ||
            number < 1 ||
            number > TOTAL_VIDEOS
        ) {

            document.getElementById(
                "message"
            ).textContent =
                "Enter a number between 1 and " +
                TOTAL_VIDEOS;

            return;

        }

        document.getElementById(
            "message"
        ).textContent = "";

        loadVideo(number - 1);

    }


    /*
    =====================================
    CREATE PLAYLIST BUTTONS
    =====================================
    */

    function createPlaylist() {

        const container =
            document.getElementById("playlist");

        container.innerHTML = "";

        for (
            let i = 0;
            i < TOTAL_VIDEOS;
            i++
        ) {

            const button =
                document.createElement("button");

            button.textContent = i + 1;

            button.dataset.index = i;

            button.addEventListener(
                "click",
                function () {
                    loadVideo(i);
                }
            );

            container.appendChild(button);

        }

    }


    /*
    =====================================
    HIGHLIGHT SELECTED VIDEO
    =====================================
    */

    function updateActiveVideo() {

        const buttons =
            document.querySelectorAll(
                "#playlist button"
            );

        buttons.forEach(function (button) {

            const index =
                Number(button.dataset.index);

            button.classList.toggle(
                "active",
                index === currentIndex
            );

        });

    }


    /*
    =====================================
    REFRESH PLAYER
    =====================================
    */

    function refreshVideo() {

        const player =
            document.getElementById("videoPlayer");

        player.src = getVideoURL(currentIndex);

    }


    /*
    =====================================
    INITIALIZE
    =====================================
    */

    createPlaylist();

    loadVideo(0);

    document.getElementById(
        "videoNumber"
    ).addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {
                jumpToNumber();
            }

        }
    );

</script>

</body>
</html>
